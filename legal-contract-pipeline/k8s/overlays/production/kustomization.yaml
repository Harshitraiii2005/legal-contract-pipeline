apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: legal-production

resources:
  - ../../base
  - pdb.yaml

patches:
  - path: replica-patch.yaml
  - path: resources-patch.yaml

images:
  - name: legal-backend
    newTag: latest   # overwritten by Jenkins: `kustomize edit set image legal-backend=<registry>/<image>:<sha>`
  - name: legal-frontend
    newTag: latest

configMapGenerator:
  - name: legal-backend-config
    behavior: merge
    literals:
      - ENV=production
      - DEBUG=false
      - CORS_ORIGINS=https://app.legalai.example.com

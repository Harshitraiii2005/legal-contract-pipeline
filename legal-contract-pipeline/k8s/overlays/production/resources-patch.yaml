apiVersion: apps/v1
kind: Deployment
metadata:
  name: legal-backend
spec:
  template:
    spec:
      containers:
        - name: legal-backend
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: "2", memory: 2Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legal-worker
spec:
  template:
    spec:
      containers:
        - name: legal-worker
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: "2", memory: 2Gi }

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: legal-staging

resources:
  - ../../base

patches:
  - path: replica-patch.yaml
  - path: ingress-patch.yaml

images:
  - name: legal-backend
    newTag: latest   # overwritten by Jenkins: `kustomize edit set image legal-backend=<registry>/<image>:<sha>`
  - name: legal-frontend
    newTag: latest

configMapGenerator:
  - name: legal-backend-config
    behavior: merge
    literals:
      - ENV=staging
      - DEBUG=true
      - CORS_ORIGINS=https://staging.legalai.example.com

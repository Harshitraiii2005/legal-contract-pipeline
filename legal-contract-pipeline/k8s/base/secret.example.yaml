# Secrets are NOT committed with real values.
# In staging/production, this is managed by External Secrets Operator or
# Sealed Secrets — this file documents the expected keys and is used as-is
# only for local `kind`/minikube testing with dummy values.
#
# Populate before applying:
#   kubectl create secret generic legal-backend-secrets \
#     --namespace=legal-pipeline \
#     --from-literal=SECRET_KEY=... \
#     --from-literal=DATABASE_URL=postgresql://... \
#     --from-literal=ANTHROPIC_API_KEY=... \
#     --from-literal=PINECONE_API_KEY=... \
#     --from-literal=AWS_ACCESS_KEY_ID=... \
#     --from-literal=AWS_SECRET_ACCESS_KEY=... \
#     --from-literal=SMTP_USER=... \
#     --from-literal=SMTP_PASSWORD=... \
#     --from-literal=REDIS_URL=redis://...
apiVersion: v1
kind: Secret
metadata:
  name: legal-backend-secrets
  labels:
    app: legal-backend
type: Opaque
stringData:
  SECRET_KEY: "CHANGE_ME_AT_LEAST_32_CHARACTERS_LONG"
  POSTGRES_PASSWORD: "CHANGE_ME"
  DATABASE_URL: "postgresql://legal:CHANGE_ME@postgres:5432/legaldb"
  REDIS_URL: "redis://redis:6379/0"
  ANTHROPIC_API_KEY: "CHANGE_ME"
  PINECONE_API_KEY: "CHANGE_ME"
  AWS_ACCESS_KEY_ID: "CHANGE_ME"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME"
  SMTP_USER: "CHANGE_ME"
  SMTP_PASSWORD: "CHANGE_ME"

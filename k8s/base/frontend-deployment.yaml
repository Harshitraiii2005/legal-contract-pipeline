apiVersion: apps/v1
kind: Deployment
metadata:
  name: legal-frontend
  labels:
    app: legal-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: legal-frontend
  template:
    metadata:
      labels:
        app: legal-frontend
    spec:
      containers:
        - name: legal-frontend
          image: legal-frontend:latest  # overwritten by kustomize image transformer
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: legal-frontend
  labels:
    app: legal-frontend
spec:
  selector:
    app: legal-frontend
  ports:
    - port: 80
      targetPort: 80

apiVersion: apps/v1
kind: Deployment
metadata:
  name: legal-backend
  labels:
    app: legal-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: legal-backend
  template:
    metadata:
      labels:
        app: legal-backend
    spec:
      containers:
        - name: legal-backend
          image: legal-backend:latest  # overwritten by kustomize image transformer
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: legal-backend-config
            - secretRef:
                name: legal-backend-secrets
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
      initContainers:
        - name: migrate
          image: legal-backend:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: legal-backend-config
            - secretRef:
                name: legal-backend-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: legal-backend
  labels:
    app: legal-backend
spec:
  selector:
    app: legal-backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: legal-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: legal-backend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }

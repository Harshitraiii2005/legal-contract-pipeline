[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legal-contract-pipeline"
version = "1.0.0"
description = "AI-powered contract review pipeline"
requires-python = ">=3.11"

dependencies = [
    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",

    # LangGraph + LLM
    "langgraph>=0.1.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-core>=0.2.0",
    "groq>=0.9.0",
    "tenacity>=8.3.0",

    # Embeddings + RAG
    "pinecone>=3.2.0",
    "sentence-transformers>=3.0.0",

    # DB / ORM
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.1.3",

    # Workers
    "celery[redis]>=5.4.0",
    "redis>=5.0.4",

    # Document processing
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.2",
    "reportlab>=4.2.0",

    # Storage
    "boto3>=1.34.0",

    # Email
    "aiosmtplib>=3.0.0",

    # Logging
    "structlog>=24.2.0",

    # Evals
    "mlflow>=2.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.7",
    "mypy>=1.10.0",
    "factory-boy>=3.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
